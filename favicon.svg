<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="失心韵">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2649"/>
      <stop offset=".55" stop-color="#111730"/>
      <stop offset="1" stop-color="#080b17"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="52%">
      <stop offset="0" stop-color="#ffd75e" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffd75e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wool" cx="36%" cy="26%" r="82%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f6f2f7"/>
      <stop offset="1" stop-color="#d9d2e0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <circle cx="32" cy="33" r="27" fill="url(#halo)"/>

  <!-- 小角 -->
  <ellipse cx="16.2" cy="23.4" rx="4.4" ry="5.6" fill="#3d3037" transform="rotate(-36 16.2 23.4)"/>
  <ellipse cx="47.8" cy="23.4" rx="4.4" ry="5.6" fill="#3d3037" transform="rotate(36 47.8 23.4)"/>

  <!-- 绒毛团 -->
  <g fill="url(#wool)">
    <circle cx="20.4" cy="30.2" r="6.6"/>
    <circle cx="30" cy="26" r="7.4"/>
    <circle cx="43.4" cy="29.2" r="6.8"/>
    <circle cx="32" cy="38.4" r="14.2"/>
  </g>

  <!-- 腮红 -->
  <ellipse cx="22.6" cy="40.6" rx="4" ry="2.6" fill="#f2a2ad" opacity=".92"/>
  <ellipse cx="41.4" cy="40.6" rx="4" ry="2.6" fill="#f2a2ad" opacity=".92"/>

  <!-- 眼睛 -->
  <circle cx="26.4" cy="35.4" r="1.95" fill="#2e2730"/>
  <circle cx="37.6" cy="35.4" r="1.95" fill="#2e2730"/>

  <!-- 嘴 -->
  <path d="M29.4 39.6c.9 1.15 1.7 1.7 2.6 1.7s1.7-.55 2.6-1.7" fill="none" stroke="#2e2730" stroke-width="1.6" stroke-linecap="round"/>
</svg>
